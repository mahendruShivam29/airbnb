version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE
  # ---------------------------------------------------------------------------
  
  mongodb:
    image: mongo:7.0
    container_name: airbnb-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass123
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airbnb-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: airbnb-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airbnb-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: airbnb-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - airbnb-network

  # ---------------------------------------------------------------------------
  # MICROSERVICES
  # ---------------------------------------------------------------------------

  traveler-service:
    build: 
      context: .
      dockerfile: traveler-service/Dockerfile
    container_name: airbnb-traveler-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      MONGODB_URI: mongodb://root:pass123@mongodb:27017/airbnb?authSource=admin
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: your_jwt_secret
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:5173
      PROPERTY_SERVICE_URL: http://property-service:4002
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - airbnb-network

  owner-service:
    build: 
      context: .
      dockerfile: owner-service/Dockerfile
    container_name: airbnb-owner-service
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      MONGODB_URI: mongodb://root:pass123@mongodb:27017/airbnb?authSource=admin
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: your_jwt_secret
      CLIENT_ORIGIN: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - airbnb-network

  property-service:
    build: 
      context: .
      dockerfile: property-service/Dockerfile
    container_name: airbnb-property-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      MONGODB_URI: mongodb://root:pass123@mongodb:27017/airbnb?authSource=admin
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: your_jwt_secret
      CLIENT_ORIGIN: http://localhost:5173
    volumes:
      - property_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - airbnb-network

  ai-agent:
    build: 
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: airbnb-ai-agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MONGODB_URI: mongodb://root:pass123@mongodb:27017
      MONGODB_BOOKING_DB: airbnb_booking
      MONGODB_PROPERTY_DB: airbnb_property
      CORS_ORIGIN: http://localhost:5173
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.0-flash-exp}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - airbnb-network

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------

  client:
    build: 
      context: ./client
      dockerfile: Dockerfile
    container_name: airbnb-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - traveler-service
      - owner-service
      - property-service
      - ai-agent
    networks:
      - airbnb-network

volumes:
  mongodb_data:
  property_uploads:

networks:
  airbnb-network:
    driver: bridge
