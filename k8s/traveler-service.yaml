apiVersion: apps/v1
kind: Deployment
metadata:
  name: traveler-service
  namespace: airbnb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traveler-service
  template:
    metadata:
      labels:
        app: traveler-service
    spec:
      containers:
        - name: traveler-service
          image: traveler-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            - name: SERVICE_NAME
              value: "traveler-service"
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: MONGODB_URI
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: KAFKA_BROKERS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: airbnb-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: JWT_EXPIRES_IN
            - name: CLIENT_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: CLIENT_ORIGIN
            - name: PROPERTY_SERVICE_URL
              value: "http://property-service:4002"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: traveler-service
  namespace: airbnb
spec:
  selector:
    app: traveler-service
  ports:
    - protocol: TCP
      port: 4001
      targetPort: 4001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: traveler-service-hpa
  namespace: airbnb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traveler-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
