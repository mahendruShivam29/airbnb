apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: airbnb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      containers:
        - name: ai-agent
          image: ai-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: MONGODB_URI
            - name: LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: LLM_PROVIDER
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: LLM_MODEL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: CORS_ORIGIN
            # Add API keys from secrets if available
            # - name: TAVILY_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: airbnb-secrets
            #       key: TAVILY_API_KEY
            # - name: GOOGLE_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: airbnb-secrets
            #       key: GOOGLE_API_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
  namespace: airbnb
spec:
  selector:
    app: ai-agent
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
