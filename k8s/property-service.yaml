apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-service
  namespace: airbnb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: property-service
  template:
    metadata:
      labels:
        app: property-service
    spec:
      containers:
        - name: property-service
          image: property-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
            - name: SERVICE_NAME
              value: "property-service"
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: MONGODB_URI
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: KAFKA_BROKERS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: airbnb-secrets
                  key: JWT_SECRET
            - name: CLIENT_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: airbnb-config
                  key: CLIENT_ORIGIN
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/uploads
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: property-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: property-service
  namespace: airbnb
spec:
  selector:
    app: property-service
  ports:
    - protocol: TCP
      port: 4002
      targetPort: 4002
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: property-uploads-pvc
  namespace: airbnb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: property-service-hpa
  namespace: airbnb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: property-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
